name: Rayman Legends
name_ar: ريمان ليجندز
genre: platformer
game_hint: >
  A 2D platformer. The player has already opened the game. From the title screen, press a key, choose Continue, and you're in.
  Menus are chosen with the arrows + Enter. On-screen hints like "[W] Open" or "(ESC) Help" show which key does what.
  If you don't know a key yet, open Options > Controls once and remember what each key does.
  Teensies are small blue creatures in cages: free them. Lums are yellow and worth collecting.
  Teensies can be in cages floating in the air: jump/glide up to them and attack (S).
game_hint_ar: >
  لعبة منصات ثنائية الأبعاد. اللاعب فتح اللعبة بالفعل. من شاشة العنوان، اضغط مفتاحًا، اختر Continue، وأنت بالداخل.
  تُختار القوائم بالأسهم + Enter. التلميحات على الشاشة مثل "[W] Open" أو "(ESC) Help" تُظهر أي مفتاح يفعل ماذا.
  إذا لم تعرف مفتاحًا بعد، افتح Options > Controls مرة واحدة وتذكر ماذا يفعل كل مفتاح.
  Teensies مخلوقات زرقاء صغيرة في أقفاص: حررها. Lums صفراء وتستحق الجمع.
  يمكن أن تكون Teensies في أقفاص عائمة في الهواء: اقفز/انزلق إليها واهجم (S).
