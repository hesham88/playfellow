name: Any game (keyboard)
name_ar: أي لعبة (لوحة المفاتيح)
genre: generic
game_hint: >
  Read the on-screen key hints (like [Space] or [Backspace]) and use the matching KEY_ action; arrows move or choose in menus.
game_hint_ar: >
  اقرأ تلميحات المفاتيح على الشاشة (مثل [Space] أو [Backspace]) واستخدم الإجراء KEY_ المطابق؛ الأسهم تتحرك أو تختار في القوائم.
actions:
  UP:
    keys: up
    hold: 0.15
    says: "press up arrow (hold 0.15 seconds)"
    says_ar: "اضغط سهم up (اضغط 0.15 ثانية)"

  DOWN:
    keys: down
    hold: 0.15
    says: "press down arrow (hold 0.15 seconds)"
    says_ar: "اضغط سهم down (اضغط 0.15 ثانية)"

  LEFT:
    keys: left
    hold: 0.15
    says: "press left arrow (hold 0.15 seconds)"
    says_ar: "اضغط سهم left (اضغط 0.15 ثانية)"

  RIGHT:
    keys: right
    hold: 0.15
    says: "press right arrow (hold 0.15 seconds)"
    says_ar: "اضغط سهم right (اضغط 0.15 ثانية)"

  HOLD_LEFT:
    hold_start: left
    says: "start holding left arrow (keeps it pressed until stopped)"
    says_ar: "ابدأ الضغط على سهم left (يبقيه مضغوطًا حتى يتوقف)"

  HOLD_RIGHT:
    hold_start: right
    says: "start holding right arrow (keeps it pressed until stopped)"
    says_ar: "ابدأ الضغط على سهم right (يبقيه مضغوطًا حتى يتوقف)"

  STOP_MOVING:
    release_all: true
    says: "stop all movement (release all held keys)"
    says_ar: "أوقف كل الحركة (حرر كل المفاتيح المضغوطة)"

  WAIT:
    wait: 0.6
    says: "wait a moment"
    says_ar: "انتظر لحظة"

  KEY_A:
    keys: a
    hold: 0.12
    says: "press a (check what it does from on-screen hints)"
    says_ar: "اضغط a (تحقق ماذا يفعل من التلميحات على الشاشة)"

