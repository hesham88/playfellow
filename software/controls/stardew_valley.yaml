  SLOT_8:      {keys: "8", hold: 0.05, says: "toolbar slot 8", says_ar: "خانة الأدوات 8"}
  SLOT_9:      {keys: "9", hold: 0.05, says: "toolbar slot 9", says_ar: "خانة الأدوات 9"}
